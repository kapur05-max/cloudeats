<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Your download | CloudZio Children's Digital Learning</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:#EAF6FF;color:#05081c;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px;line-height:1.55}
  .box{max-width:480px;background:#fff;border-radius:20px;padding:32px 24px;text-align:center;box-shadow:0 6px 24px rgba(11,61,145,.12)}
  h1{font-size:1.6rem;margin:0 0 12px;color:#0b3d91}
  p{margin:0 0 12px;color:#333}
  .btn{display:inline-block;margin-top:8px;background:#0b3d91;color:#fff;text-decoration:none;padding:14px 26px;border-radius:999px;font-weight:800;font-size:1.05rem}
  .small{font-size:.88rem;color:#555}
</style>
</head>
<body>
<div class="box">
  <h1>Thank you!</h1>
  <p id="status">Checking your payment&hellip;</p>
  <div id="action"></div>
  <p class="small">Stripe will also email you a receipt. Keep this page&rsquo;s link (bookmark it) if you want to download again. Any problem? Email <a href="mailto:support@cloudzio.co.uk">support@cloudzio.co.uk</a>.</p>
  <p class="small"><a href="/learn/">Back to Children&rsquo;s Digital Learning</a></p>
</div>
<script>
(function(){
  var URL_="https://pyljmukjqnckkogmregm.supabase.co/functions/v1/workbook-store";
  var KEY="sb_publishable_qv3MZTjYzg23Y2H2-jbIuw_z6NbnxfB";
  var st=document.getElementById("status"), ac=document.getElementById("action");
  var sid=new URLSearchParams(location.search).get("session_id");
  if(!sid){ st.textContent="This page needs the link from your payment. Please email support@cloudzio.co.uk and we will help."; return; }
  fetch(URL_,{method:"POST",headers:{"Content-Type":"application/json","apikey":KEY},body:JSON.stringify({action:"download",session_id:sid})})
    .then(function(r){return r.json()})
    .then(function(d){
      if(d&&d.urls&&d.urls.length>1){ st.textContent="Your payment has gone through. Your workbooks are ready."; ac.innerHTML=d.urls.map(function(u){return '<a class="btn" style="display:block;margin:8px 0" href="'+String(u.url).replace(/"/g,"&quot;")+'">Download: '+String(u.name).replace(/[<>&"]/g,"")+' (PDF)</a>';}).join(""); }
      else if(d&&d.url){ st.textContent="Your payment has gone through. Your workbook is ready."; ac.innerHTML='<a class="btn" href="'+d.url.replace(/"/g,"&quot;")+'">Download your workbook (PDF)</a>'; }
      else { st.textContent=(d&&d.error)||"Sorry, something went wrong."; }
    })
    .catch(function(){ st.textContent="Sorry, we couldn\u2019t load your download. Please refresh, or email support@cloudzio.co.uk."; });
})();
</script>
</body>
</html>
